# CRD for orch.bairavs.com/v1alpha1 Skill.
#
# Hand-authored (not controller-gen-generated) so a fresh checkout works
# without additional tooling. If skill_types.go grows a field, mirror it
# here or regenerate via `controller-gen crd paths=./api/...`.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: skills.orch.bairavs.com
spec:
  group: orch.bairavs.com
  scope: Namespaced
  names:
    kind: Skill
    listKind: SkillList
    plural: skills
    singular: skill
    shortNames:
      - skl
      - skls
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Endpoint
          type: string
          jsonPath: .status.endpoint
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  minLength: 1
                  description: Container image ref for the user's MCP server.
                transport:
                  type: string
                  enum: [sse, http]
                  default: sse
                  description: MCP transport the server speaks. v1 supports HTTP-based transports only; stdio is deferred.
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  default: 3000
                  description: Port the MCP server listens on inside its container.
                healthPath:
                  type: string
                  default: /health
                  description: HTTP path used by the readiness/liveness probes.
                env:
                  type: array
                  description: Pass-through container environment variables.
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                      valueFrom:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                resources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: Container resource requests/limits (standard PodSpec shape).
                service:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [ClusterIP, NodePort, LoadBalancer]
                      default: ClusterIP
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                      default: 3000
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Deploying, Ready, Failed]
                endpoint:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
