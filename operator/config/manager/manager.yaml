# Operator deployment.
#
# Two replicas with leader election: one reconciles, the other takes over
# within seconds if its node or Pod goes away. They prefer different nodes,
# and the PodDisruptionBudget below keeps one up during node drains. On a
# one-node cluster both run on that node, which is fine.

---
apiVersion: v1
kind: Namespace
metadata:
  name: bairav-system
  labels:
    app.kubernetes.io/name: bairav-system
    app.kubernetes.io/managed-by: bairav-operator

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bairav-operator
  namespace: bairav-system
  labels:
    app.kubernetes.io/name: bairav-operator
    app.kubernetes.io/managed-by: bairav-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bairav-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bairav-operator
    spec:
      serviceAccountName: bairav-operator
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: bairav-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: bairav/operator:laptop
          imagePullPolicy: IfNotPresent
          # Images the operator uses for Model and DLP pods. Release
          # install.yaml swaps these (and the image above) for
          # ghcr.io/bairav-foundation/*:<version>.
          env:
            - name: BAIRAV_SERVING_IMAGE
              value: bairav/serving:laptop
            - name: BAIRAV_DLP_IMAGE
              value: bairav/dlp:laptop
          args:
            - --leader-elect
            - --metrics-bind-address=:8081
            - --health-probe-bind-address=:8082
          ports:
            - name: metrics
              containerPort: 8081
            - name: health
              containerPort: 8082
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bairav-operator
  namespace: bairav-system
  labels:
    app.kubernetes.io/name: bairav-operator
    app.kubernetes.io/managed-by: bairav-operator
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bairav-operator
