# CI: the same checks as `make ci` (gofmt, go mod tidy check, vet,
# golangci-lint, tests with -race including the DLP bypass regression suite
# and false-positive benchmark, build) on every push and pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: |
            cli/go.sum
            operator/go.sum
      - name: golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: make ci
        run: make ci

  goreleaser-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  # Every action pinned to a commit SHA and every base image to a digest (a
  # tag can be moved by whoever owns it). No network: just reads the files.
  pinned-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/pin-actions.sh --check
      - run: scripts/pin-images.sh --check

  # Known vulnerabilities in our Go code and dependencies that our code
  # actually reaches (govulncheck only reports reachable ones).
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: |
            cli/go.sum
            operator/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: cli
        working-directory: cli
        run: govulncheck ./...
      - name: operator
        working-directory: operator
        run: govulncheck ./...
