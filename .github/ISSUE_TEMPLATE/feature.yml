name: Feature request
description: Something you'd like Orch Engine to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you'd like it to work. Rough is fine.
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Your setup, how many teams or models, links.
