# Weekly update PRs for everything we depend on. Each one runs CI before it
# can be merged (main ruleset), and pinned action SHAs are updated together
# with their "# vX" comments.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
  # cli and operator are one Go workspace (the CLI imports the operator's
  # API types), so they must move together: one PR for both, never one
  # module ahead of the other.
  - package-ecosystem: gomod
    directories: ["/cli", "/operator"]
    schedule: { interval: weekly, day: monday }
    groups:
      go-deps: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: ["/images/serving", "/images/dlp", "/operator", "/examples/mcp-echo"]
    schedule: { interval: weekly, day: monday }
    groups:
      base-images: { patterns: ["*"] }
