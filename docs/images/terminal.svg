<svg xmlns="http://www.w3.org/2000/svg" width="900" height="547" viewBox="0 0 900 547" role="img" aria-label="Terminal: install the bairav CLI, install the operator, deploy a model with DLP inside its pod, see an Aadhaar number and an AWS key redacted, an upgrade rolled back by an eval gate, and DLP started as a LiteLLM guardrail">
<title>BAIRAVS Orch Engine in one minute</title>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre}</style>
<rect width="900" height="547" rx="12" fill="#142030"/>
<rect width="900" height="32" rx="12" fill="#1c2b3f"/><rect y="20" width="900" height="12" fill="#1c2b3f"/>
<circle cx="20" cy="16" r="5.5" fill="#ec6a5e"/><circle cx="38" cy="16" r="5.5" fill="#f4bf4f"/><circle cx="56" cy="16" r="5.5" fill="#61c554"/>
<text x="450.0" y="20" text-anchor="middle" fill="#8d98a8" style="font-size:12px">bairav · orch engine</text>
<clipPath id="c0"><rect x="18" y="31" height="21" width="0"><animate attributeName="width" dur="24.10s" repeatCount="indefinite" keyTimes="0;0.0249;0.0669;0.9834;1" values="0;0;364;364;0"/></rect></clipPath>
<text x="18" y="46" clip-path="url(#c0)" opacity="0"><animate attributeName="opacity" dur="24.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0249;0.9834" values="0;1;0"/><tspan fill="#2a9d8f">$ </tspan><tspan fill="#e8eef5">curl -fsSL https://bairavs.com/install.sh | sh</tspan></text>
<text x="18" y="67" opacity="0"><animate attributeName="opacity" dur="24.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0772;0.9834" values="0;1;0"/><tspan fill="#9fb0c3">Downloading bairav v0.2.0 (darwin/arm64)... checksum OK</tspan></text>
<text x="18" y="88" opacity="0"><animate attributeName="opacity" dur="24.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0897;0.9834" values="0;1;0"/><tspan fill="#9fb0c3">Installed bairav v0.2.0 to /usr/local/bin/bairav</tspan></text>
<clipPath id="c4"><rect x="18" y="115" height="21" width="0"><animate attributeName="width" dur="24.10s" repeatCount="indefinite" keyTimes="0;0.1167;0.1913;0.9834;1" values="0;0;792;792;0"/></rect></clipPath>
<text x="18" y="130" clip-path="url(#c4)" opacity="0"><animate attributeName="opacity" dur="24.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1167;0.9834" values="0;1;0"/><tspan fill="#2a9d8f">$ </tspan><tspan fill="#e8eef5">kubectl apply -f https://github.com/bairav-foundation/orch-engine/releases/latest/download/install.yaml</tspan></text>
<text x="18" y="151" opacity="0"><animate attributeName="opacity" dur="24.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2017;0.9834" values="0;1;0"/><tspan fill="#9fb0c3">customresourcedefinition.apiextensions.k8s.io/models.orch.bairavs.com created   (+4 more)</tspan></text>
<text x="18" y="172" opacity="0"><animate attributeName="opacity" dur="24.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2142;0.9834" values="0;1;0"/><tspan fill="#9fb0c3">deployment.apps/bairav-operator created</tspan></text>
<clipPath id="c8"><rect x="18" y="199" height="21" width="0"><animate attributeName="width" dur="24.10s" repeatCount="indefinite" keyTimes="0;0.2411;0.3158;0.9834;1" values="0;0;709;709;0"/></rect></clipPath>
<text x="18" y="214" clip-path="url(#c8)" opacity="0"><animate attributeName="opacity" dur="24.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2411;0.9834" values="0;1;0"/><tspan fill="#2a9d8f">$ </tspan><tspan fill="#e8eef5">bairav model deploy Qwen/Qwen2.5-0.5B-Instruct-GGUF --target k8s --name qwen --dlp-ref guard</tspan></text>
<text x="18" y="235" opacity="0"><animate attributeName="opacity" dur="24.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3262;0.9834" values="0;1;0"/><tspan fill="#9fb0c3">  Phase: Pulling    4s</tspan></text>
<text x="18" y="256" opacity="0"><animate attributeName="opacity" dur="24.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3386;0.9834" values="0;1;0"/><tspan fill="#6fd3c5">✓ Ready: http://qwen.default.svc.cluster.local:8080/v1   (DLP enforced inside the model pod)</tspan></text>
<clipPath id="c12"><rect x="18" y="283" height="21" width="0"><animate attributeName="width" dur="24.10s" repeatCount="indefinite" keyTimes="0;0.3656;0.4403;0.9834;1" values="0;0;656;656;0"/></rect></clipPath>
<text x="18" y="298" clip-path="url(#c12)" opacity="0"><animate attributeName="opacity" dur="24.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3656;0.9834" values="0;1;0"/><tspan fill="#2a9d8f">$ </tspan><tspan fill="#e8eef5">curl -s localhost:8080/v1/chat/completions -d '{"messages":[{"role":"user","content":</tspan></text>
<clipPath id="c13"><rect x="18" y="304" height="21" width="0"><animate attributeName="width" dur="24.10s" repeatCount="indefinite" keyTimes="0;0.4506;0.5253;0.9834;1" values="0;0;806;806;0"/></rect></clipPath>
<text x="18" y="319" clip-path="url(#c13)" opacity="0"><animate attributeName="opacity" dur="24.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4506;0.9834" values="0;1;0"/><tspan fill="#e8eef5">      "Repeat: my aadhaar is 2345 6789 0124, key AKIAIOSFODNN7EXAMPLE"}]}' | jq .choices[0].message.content</tspan></text>
<text x="18" y="340" opacity="0"><animate attributeName="opacity" dur="24.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5502;0.9834" values="0;1;0"/><tspan fill="#6fd3c5">"My aadhaar is [REDACTED:AADHAAR], key [REDACTED:AWS_ACCESS_KEY]"</tspan></text>
<clipPath id="c16"><rect x="18" y="367" height="21" width="0"><animate attributeName="width" dur="24.10s" repeatCount="indefinite" keyTimes="0;0.5772;0.6518;0.9834;1" values="0;0;649;649;0"/></rect></clipPath>
<text x="18" y="382" clip-path="url(#c16)" opacity="0"><animate attributeName="opacity" dur="24.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5772;0.9834" values="0;1;0"/><tspan fill="#2a9d8f">$ </tspan><tspan fill="#e8eef5">bairav model upgrade qwen --to Qwen/Qwen3-1.7B-GGUF --target k8s --eval support.yaml</tspan></text>
<text x="18" y="403" opacity="0"><animate attributeName="opacity" dur="24.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6622;0.9834" values="0;1;0"/><tspan fill="#9fb0c3">  Eval gate: support (12 cases) ...   ✗ json-output   ✗ refund-policy</tspan></text>
<text x="18" y="424" opacity="0"><animate attributeName="opacity" dur="24.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6747;0.9834" values="0;1;0"/><tspan fill="#f4a259">✗ Score 10/12, needs 100%: rolled back. qwen still serves Qwen2.5-0.5B, agents untouched</tspan></text>
<clipPath id="c20"><rect x="18" y="451" height="21" width="0"><animate attributeName="width" dur="24.10s" repeatCount="indefinite" keyTimes="0;0.7016;0.7573;0.9834;1" values="0;0;476;476;0"/></rect></clipPath>
<text x="18" y="466" clip-path="url(#c20)" opacity="0"><animate attributeName="opacity" dur="24.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.7016;0.9834" values="0;1;0"/><tspan fill="#2a9d8f">$ </tspan><tspan fill="#e8eef5">bairav dlp serve --litellm-guardrail --pack global-safe,india</tspan></text>
<text x="18" y="487" opacity="0"><animate attributeName="opacity" dur="24.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.7677;0.9834" values="0;1;0"/><tspan fill="#9fb0c3">  mode:      LiteLLM guardrail (POST /beta/litellm_basic_guardrail_api)</tspan></text>
<text x="18" y="508" opacity="0"><animate attributeName="opacity" dur="24.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.7801;0.9834" values="0;1;0"/><tspan fill="#9fb0c3">  packs:     global-safe, india   audit: masked</tspan></text>
</svg>
