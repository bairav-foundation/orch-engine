<svg xmlns="http://www.w3.org/2000/svg" width="900" height="463" viewBox="0 0 900 463" role="img" aria-label="Terminal: install the bairav CLI, install the operator, deploy a model with DLP inside its pod, see an Aadhaar number and an AWS key redacted, and start DLP as a LiteLLM guardrail">
<title>BAIRAVS Orch Engine in one minute</title>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre}</style>
<rect width="900" height="463" rx="12" fill="#142030"/>
<rect width="900" height="32" rx="12" fill="#1c2b3f"/><rect y="20" width="900" height="12" fill="#1c2b3f"/>
<circle cx="20" cy="16" r="5.5" fill="#ec6a5e"/><circle cx="38" cy="16" r="5.5" fill="#f4bf4f"/><circle cx="56" cy="16" r="5.5" fill="#61c554"/>
<text x="450.0" y="20" text-anchor="middle" fill="#8d98a8" style="font-size:12px">bairav · orch engine</text>
<clipPath id="c0"><rect x="18" y="31" height="21" width="0"><animate attributeName="width" dur="21.10s" repeatCount="indefinite" keyTimes="0;0.0284;0.0764;0.9810;1" values="0;0;364;364;0"/></rect></clipPath>
<text x="18" y="46" clip-path="url(#c0)" opacity="0"><animate attributeName="opacity" dur="21.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0284;0.9810" values="0;1;0"/><tspan fill="#2a9d8f">$ </tspan><tspan fill="#e8eef5">curl -fsSL https://bairavs.com/install.sh | sh</tspan></text>
<text x="18" y="67" opacity="0"><animate attributeName="opacity" dur="21.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0882;0.9810" values="0;1;0"/><tspan fill="#9fb0c3">Downloading bairav v0.2.0 (darwin/arm64)... checksum OK</tspan></text>
<text x="18" y="88" opacity="0"><animate attributeName="opacity" dur="21.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1024;0.9810" values="0;1;0"/><tspan fill="#9fb0c3">Installed bairav v0.2.0 to /usr/local/bin/bairav</tspan></text>
<clipPath id="c4"><rect x="18" y="115" height="21" width="0"><animate attributeName="width" dur="21.10s" repeatCount="indefinite" keyTimes="0;0.1332;0.2185;0.9810;1" values="0;0;792;792;0"/></rect></clipPath>
<text x="18" y="130" clip-path="url(#c4)" opacity="0"><animate attributeName="opacity" dur="21.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1332;0.9810" values="0;1;0"/><tspan fill="#2a9d8f">$ </tspan><tspan fill="#e8eef5">kubectl apply -f https://github.com/bairav-foundation/orch-engine/releases/latest/download/install.yaml</tspan></text>
<text x="18" y="151" opacity="0"><animate attributeName="opacity" dur="21.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2304;0.9810" values="0;1;0"/><tspan fill="#9fb0c3">customresourcedefinition.apiextensions.k8s.io/models.orch.bairavs.com created   (+4 more)</tspan></text>
<text x="18" y="172" opacity="0"><animate attributeName="opacity" dur="21.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2446;0.9810" values="0;1;0"/><tspan fill="#9fb0c3">deployment.apps/bairav-operator created</tspan></text>
<clipPath id="c8"><rect x="18" y="199" height="21" width="0"><animate attributeName="width" dur="21.10s" repeatCount="indefinite" keyTimes="0;0.2754;0.3607;0.9810;1" values="0;0;709;709;0"/></rect></clipPath>
<text x="18" y="214" clip-path="url(#c8)" opacity="0"><animate attributeName="opacity" dur="21.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2754;0.9810" values="0;1;0"/><tspan fill="#2a9d8f">$ </tspan><tspan fill="#e8eef5">bairav model deploy Qwen/Qwen2.5-0.5B-Instruct-GGUF --target k8s --name qwen --dlp-ref guard</tspan></text>
<text x="18" y="235" opacity="0"><animate attributeName="opacity" dur="21.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3725;0.9810" values="0;1;0"/><tspan fill="#9fb0c3">  Phase: Pulling    4s</tspan></text>
<text x="18" y="256" opacity="0"><animate attributeName="opacity" dur="21.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3868;0.9810" values="0;1;0"/><tspan fill="#6fd3c5">✓ Ready: http://qwen.default.svc.cluster.local:8080/v1   (DLP enforced inside the model pod)</tspan></text>
<clipPath id="c12"><rect x="18" y="283" height="21" width="0"><animate attributeName="width" dur="21.10s" repeatCount="indefinite" keyTimes="0;0.4176;0.5028;0.9810;1" values="0;0;656;656;0"/></rect></clipPath>
<text x="18" y="298" clip-path="url(#c12)" opacity="0"><animate attributeName="opacity" dur="21.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4176;0.9810" values="0;1;0"/><tspan fill="#2a9d8f">$ </tspan><tspan fill="#e8eef5">curl -s localhost:8080/v1/chat/completions -d '{"messages":[{"role":"user","content":</tspan></text>
<clipPath id="c13"><rect x="18" y="304" height="21" width="0"><animate attributeName="width" dur="21.10s" repeatCount="indefinite" keyTimes="0;0.5147;0.6000;0.9810;1" values="0;0;806;806;0"/></rect></clipPath>
<text x="18" y="319" clip-path="url(#c13)" opacity="0"><animate attributeName="opacity" dur="21.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5147;0.9810" values="0;1;0"/><tspan fill="#e8eef5">      "Repeat: my aadhaar is 2345 6789 0124, key AKIAIOSFODNN7EXAMPLE"}]}' | jq .choices[0].message.content</tspan></text>
<text x="18" y="340" opacity="0"><animate attributeName="opacity" dur="21.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6284;0.9810" values="0;1;0"/><tspan fill="#6fd3c5">"My aadhaar is [REDACTED:AADHAAR], key [REDACTED:AWS_ACCESS_KEY]"</tspan></text>
<clipPath id="c16"><rect x="18" y="367" height="21" width="0"><animate attributeName="width" dur="21.10s" repeatCount="indefinite" keyTimes="0;0.6592;0.7228;0.9810;1" values="0;0;476;476;0"/></rect></clipPath>
<text x="18" y="382" clip-path="url(#c16)" opacity="0"><animate attributeName="opacity" dur="21.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6592;0.9810" values="0;1;0"/><tspan fill="#2a9d8f">$ </tspan><tspan fill="#e8eef5">bairav dlp serve --litellm-guardrail --pack global-safe,india</tspan></text>
<text x="18" y="403" opacity="0"><animate attributeName="opacity" dur="21.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.7346;0.9810" values="0;1;0"/><tspan fill="#9fb0c3">  mode:      LiteLLM guardrail (POST /beta/litellm_basic_guardrail_api)</tspan></text>
<text x="18" y="424" opacity="0"><animate attributeName="opacity" dur="21.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.7489;0.9810" values="0;1;0"/><tspan fill="#9fb0c3">  packs:     global-safe, india   audit: masked</tspan></text>
</svg>
