# GoReleaser config for the bairav CLI. Run by .github/workflows/release.yml
# on every v* tag; images are built and pushed by the same workflow first.
version: 2
project_name: bairav

builds:
  - id: bairav
    dir: cli
    main: .
    binary: bairav
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # main.Version selects the matching ghcr.io/bairav-foundation images
    # (see compose.UseReleaseImages).
    ldflags:
      - -s -w -X main.Version={{ .Tag }}

archives:
  - id: bairav
    formats: [tar.gz]
    name_template: "bairav_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# One SPDX SBOM per archive (syft), listed in checksums.txt.
sboms:
  - artifacts: archive

# checksums.txt is signed keyless with cosign (GitHub OIDC identity of the
# release workflow). It covers every archive and SBOM. Verify with:
#   cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/bairav-foundation/orch-engine/\.github/workflows/release\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]

changelog:
  use: github
  sort: asc

release:
  github:
    owner: bairav-foundation
    name: orch-engine
  prerelease: auto
  extra_files:
    - glob: ./dist-extra/install.yaml
  footer: |
    ## Install

    CLI (macOS, Linux):

        curl -fsSL https://bairavs.com/install.sh | sh

    Verify the checksums file (signed with cosign, keyless) and then the archive:

        cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
          --certificate-identity-regexp '^https://github.com/bairav-foundation/orch-engine/\.github/workflows/release\.yml@refs/tags/v' \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
        shasum -a 256 -c checksums.txt --ignore-missing

    Each archive has an SPDX SBOM next to it (`*.sbom.json`).

    Operator and CRDs on Kubernetes:

        kubectl apply -f https://github.com/bairav-foundation/orch-engine/releases/download/{{ .Tag }}/install.yaml

    Images: `ghcr.io/bairav-foundation/{serving,dlp,operator,mcp-echo}:{{ .Tag }}`
